<!DOCTYPE html>
<html>
    <head>
        <title>FORM haqqinda</title>
        <style>
            .hi{
                width: 25px;
                height: 25px;
                margin-right: 5px;
                border: 2px solid lightcoral;
                font-size: 18px;
            }
            .bye{
                border-radius: 30px;
                padding: 10px 15px;
                width: 300px;
                border:1px solid gray;
                font-size: 16px;
                font-weight: 500;
                box-shadow: 0 1px 6px gray;
                
            }
            img{
                width: 100px;
                margin-left: 60px;
            }
            .alma{
                 display: inline-block;
                 width: 48px;
                 padding: 10px 5px;
                 background-color: red;
                 text-align: center;
                 box-sizing: border-box;
            }

            .banan{
                display: inline-block;
                width: 98px;
                padding: 10px 30px;
                background-color: rgb(151, 247, 151);
                text-align: center;
                box-sizing: border-box;
            }

            .juzim{
                display: inline-block;
                width: 150px;
                padding: 10px;
                background-color: rgb(19, 190, 247);
                text-align: center;
                box-sizing: border-box;
            }
            input{
                width: 98px;
                padding: 5px 10px;
                box-sizing: border-box;
                text-align: center;
            }

            button{
                width: 150px;
                padding: 10px 20px;
                margin-top: 10px;
                box-sizing: border-box;
                text-align: center;
            }

             p{
                background-color: lightcoral;
                width: 200px;
                padding: 20px;
                border: 5px solid black;
                box-sizing: border-box;
            }

            select{
                padding-right: 50px;
            }

            select{
                width: 300px;
                padding: 10px 15px;
                box-sizing: border-box;
                margin-bottom: 15px;
            }
            select:hover{
                box-shadow: 2px 2px 2px lightgreen;
            }
            textarea{
                width: 300px;
                padding: 10px;
                border: 2px solid blue;
                transition: border-color 0.3s;
                box-sizing: border-box;
                display: block;
            }
            textarea:hover{
                border-color: blue;
            }

        </style>
    </head>
    <body>
        <form>
            
            <!--1 tapsirma-->

            <label><b>Gmail ma'nzilinizge jiberilgen 6 xanali kodti kirgizin'</b></label>
            <br> <br>
            <input type="text" maxlength="1" class="hi">
            <input type="text" maxlength="1" class="hi">
            <input type="text" maxlength="1" class="hi">
            <input type="text" maxlength="1" class="hi">
            <input type="text" maxlength="1" class="hi">
            <input type="text" maxlength="1" class="hi">

            <hr>

            <!--2 tapsirma-->
            <input type="text" placeholder="Search" minlength="2" maxlength="5" required>
            <button type="submit">Jiberiw</button>

            <hr>

            <!--3 tapsirma-->

            <input type="text" placeholder="Name" minlength="3" maxlength="10" required>
            <button type="submit">Jiberiw</button>
            <br> <br>
            <input type="email" placeholder="Email" minlength="2" maxlength="10" required>
            <button type="submit">Jiberiw</button>

            <hr>

            <!--4 tapsirma-->
            <img src="google.png" alt="google logo">
            <input type="text" placeholder="Search Google or type a URL" minlength="3" maxlength="30" required class="bye">

            <hr>

            <!--5 tapsirma-->
            <span class="alma">Alma</span>
            <span class="banan">Banan</span>
            <br> <br>
             <span class="juzim">Juzim</span>

            <hr>

            <!--6 tapsirma-->
            <label>Neshe nan alasiz?</label>
            <input type="text" value="1" id="bread">
            <button type="submit" style="display:block; margin-top:10px;">Jiberiw</button>
            
           <hr>
            
           <!--7 tapsirma-->
           <input type="text" placeholder="First name" class="first">
           <input type="text" placeholder="Last name" class="last">
           <input type="number" placeholder="Age" class="age">

           <hr>
            
           <!--8 tapsirma--> 
           <button type="submit" class="jiber">Jiberiw</button>
           <button type="submit" class="taza">Tazalaw</button>

           <hr>
           <!--9 tapsirma-->
           <p>Salem</p>

           <hr>

           <!--10 tapsirma-->
           <textarea rows="5" cols="30" placeholder="Oziniz haqqinizda..."></textarea>

           <hr>

           <!--11 tapsirma-->
           <label>Atiniz</label>
           <input type="text" minlength="2" maxlength="10" id="Atiniz" required>
           <br> <br>
           <label>Email</label>
           <input type="email" min="2" maxlength="20" required>
           <br> <br>
           <label>Parol</label>
           <input type="password" minlength="1" maxlength="20" required>
           <br> <br>
           <label>Jinsi</label>

           <input type="radio" name="jinsi" required>
           <label>Erkek</label>
 
           <input type="radio" name="jinsi" required>
           <label>Hayal</label>
           <br> <br>
           <label>Xobbiy</label>

           <input type="checkbox" required>
           <label>Shaxmat</label>

           <input type="checkbox" required>
           <label>Kitap oqiw</label>

           <input type="checkbox" required>
           <label>Sayaxat</label>

           <hr>

           <!--12 tapsirma-->
           <textarea placeholder="O'zin' haqqinda jazip ket..." rows="5" cols="30"></textarea>

           <hr>

           <label>Jaqsi korgen miyweni tanlaw.</label>
           <br>
           <select>
              <option>Alma</option>
              <option>Banan</option>
              <option>Almurt</option>
              <option>Juzim</option>
              <option>Shabdali</option>
           </select>

            <hr>

            <input type="text" placeholder="Atinizdi jazin">
            <br> <br>
            <label>Menin jaqsi koretugin miywem</label>
            <br> <br>
            <select>
            <option>Alma</option>
            <option>Banan</option>
            <option>Almurt</option>
            <option>Juzim</option>
            <option>Shabdali</option>
            </select>
            <p>Ne ushin?</p>
            <textarea rows="8" cols="30"></textarea>

            <hr>

            <select>
                <option>Xizmetti tan'lan'</option>
                <option>Shashta'rez</option>
                <option>Salon</option>
                <option>Decorator</option>
            </select>
            
           </form>
    </body>
</html>
